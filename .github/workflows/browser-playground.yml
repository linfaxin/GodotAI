name: Browser Playground

on:
  pull_request:
    paths:
      - 'scripts/jsb.react*/**'
      - 'scripts/jsb.web-engine/**'
      - 'scripts/release/**'
      - 'scripts/test/**'
      - 'apps/playground/**'
      - 'tests/browser-preflight/**'
      - 'tests/react/**'
      - 'impl/web/**'
      - 'bridge/**'
      - 'compat/**'
      - 'internal/**'
      - 'weaver/**'
      - 'weaver-editor/**'
      - 'register_types.*'
      - 'jsb.*'
      - 'SCsub'
      - 'config.py'
      - '*package*'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/browser-playground.yml'
      - '.github/workflows/build_web.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine_target:
        description: 'Actual engine target, independently of the SDK mode'
        type: choice
        options: [template_debug, template_release]
        default: template_debug
      release_version:
        description: 'Exact npm version to prepare (publication is a separate command)'
        type: string
        default: '0.1.0'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: browser-playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:react
      - name: Check showcase models and sources
        run: pnpm test:playground
      - name: Verify showcase persistence, imports and compiler regressions
        env:
          PLAYGROUND_TEST_SHELL: '1'
        run: |
          pnpm --filter @godot-js/playground exec playwright install --with-deps chromium
          pnpm --filter @godot-js/playground build:frontend
          pnpm --filter @godot-js/playground test:browser:projects
      - name: Release provenance, integrity, npm-pack consumer and failure gates
        run: pnpm test:browser:unit

  browser:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout the identified upstream engine source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.6.1-stable
          path: .browser-engine/source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.11'
      - run: python3 -m pip install scons==4.9.1
      - name: Build and collect provenance for an actual single-thread engine
        env:
          ENGINE_TARGET: ${{ inputs.engine_target || 'template_debug' }}
        run: >-
          node scripts/test/build-browser-engine.mjs
          --godot-source .browser-engine/source
          --build-dir "$RUNNER_TEMP/godot-browser-build"
          --out "$RUNNER_TEMP/browser-engine-report.json"
          --target "$ENGINE_TARGET"
          --jobs 4
      - name: Install the pinned browser verification tools
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl-mesa0
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/browser-tools/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          node --input-type=module -e 'const {chromium}=await import(process.env.RUNNER_TEMP+"/browser-tools/node_modules/playwright-core/index.mjs"); console.log("CHROMIUM="+chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Verify real main-thread compiler, revision and preview races
        run: node --test apps/playground/test/*.test.mjs
      - name: Prepare the existing native browser regression gate
        env:
          GODOT_SOURCE: ${{ runner.temp }}/godot-browser-build
          ENGINE_TARGET: ${{ inputs.engine_target || 'template_debug' }}
        run: |
          export GODOT_WEB_TEMPLATE="$RUNNER_TEMP/godot-browser-build/bin/godot.web.$ENGINE_TARGET.wasm32.nothreads.zip"
          node tests/browser-preflight/prepare.mjs "$RUNNER_TEMP/browser-preflight-site"
      - name: Verify native boot, real canvas input, restart, exit and tamper rejection
        run: node tests/browser-preflight/verify.mjs "$RUNNER_TEMP/browser-preflight-site" "$RUNNER_TEMP/browser-preflight-results"
      - name: Verify native authored source locations, compressed columns and uncaught errors
        env:
          ENGINE_BUILD_REPORT: ${{ runner.temp }}/browser-engine-report.json
        run: node tests/browser-preflight/verify-source-maps.mjs "$RUNNER_TEMP/browser-preflight-site" "$RUNNER_TEMP/browser-source-map-results"
      - name: Build the headless GodotJS editor for native project and demo resource export
        working-directory: ${{ runner.temp }}/godot-browser-build
        run: >-
          scons -j4 platform=linuxbsd target=editor arch=x86_64
          skip_js_runtime=yes use_quickjs_ng=yes tests=no optimize=speed debug_symbols=no
          vulkan=no opengl3=no x11=no wayland=no alsa=no pulseaudio=no
          dbus=no speechd=no udev=no sdl=no fontconfig=no accesskit=no
          modules_enabled_by_default=no module_GodotJS_enabled=yes
          module_regex_enabled=yes module_gdscript_enabled=yes module_freetype_enabled=yes
          module_svg_enabled=yes module_text_server_fb_enabled=yes module_gridmap_enabled=yes
          module_navigation_2d_enabled=yes module_navigation_3d_enabled=yes
          module_godot_physics_2d_enabled=yes module_godot_physics_3d_enabled=yes
          module_ogg_enabled=yes module_vorbis_enabled=yes module_gltf_enabled=yes module_jpg_enabled=yes
      - name: Build the default full-engine product candidate
        env:
          GODOT: ${{ runner.temp }}/godot-browser-build/bin/godot.linuxbsd.editor.x86_64
          GODOT_IMPORTER: ${{ runner.temp }}/godot-browser-build/bin/godot.linuxbsd.editor.x86_64
        run: >-
          node apps/playground/scripts/build.mjs
          --engine-report "$RUNNER_TEMP/browser-engine-report.json"
          --out "$RUNNER_TEMP/default-playground-site"
      - name: Accept the exact default product candidate
        env:
          PLAYGROUND_TEST_DIRECTORY: ${{ runner.temp }}/default-playground-site
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ env.CHROMIUM }}
          PLAYGROUND_FULL_ENGINE_LOOPS: '50'
          PLAYGROUND_FULL_ENGINE_REPORT: ${{ runner.temp }}/default-playground-results/runtime.json
          PLAYGROUND_EDITOR_REPORT: ${{ runner.temp }}/default-playground-results/editor.json
          PLAYGROUND_BRIDGE_REPORT: ${{ runner.temp }}/default-playground-results/bridge.json
          PLAYGROUND_SCREENSHOTS: ${{ runner.temp }}/default-playground-results/screenshots
        run: |
          node apps/playground/scripts/seal-site-acceptance.mjs "$PLAYGROUND_TEST_DIRECTORY" "$RUNNER_TEMP/default-playground-results" --begin
          pnpm --filter @godot-js/playground test:browser:full
          pnpm --filter @godot-js/playground test:browser:editor
          pnpm --filter @godot-js/playground test:browser:bridge
          PLAYGROUND_TEST_SHELL=1 node apps/playground/scripts/browser-project-test.mjs > "$RUNNER_TEMP/default-playground-results/projects.json"
          node apps/playground/scripts/browser-demo-regressions-test.mjs > "$RUNNER_TEMP/default-playground-results/demo-regressions.json"
          node apps/playground/scripts/browser-react-demos-test.mjs > "$RUNNER_TEMP/default-playground-results/react-demos.json"
          node apps/playground/scripts/browser-test.mjs > "$RUNNER_TEMP/default-playground-results/workbench.json"
          node apps/playground/scripts/seal-site-acceptance.mjs "$PLAYGROUND_TEST_DIRECTORY" "$RUNNER_TEMP/default-playground-results"
          node apps/playground/scripts/seal-site-acceptance.mjs "$PLAYGROUND_TEST_DIRECTORY" "$RUNNER_TEMP/default-playground-results" --verify
      - name: Keep the default product candidate and its exact-site acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-playground-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/default-playground-site
            ${{ runner.temp }}/default-playground-results
            ${{ runner.temp }}/browser-engine-report.json
      - name: Prepare the compatibility conformance candidate
        env:
          RELEASE_VERSION: ${{ inputs.release_version || '0.1.0' }}
        run: >-
          node scripts/test/prepare-browser-playground.mjs
          --engine-report "$RUNNER_TEMP/browser-engine-report.json"
          --out "$RUNNER_TEMP/browser-playground-site"
          --version "$RELEASE_VERSION"
      - name: Verify the actual Playground and collect release-bound evidence
        run: >-
          node scripts/test/browser-playground.mjs
          --site "$RUNNER_TEMP/browser-playground-site"
          --out "$RUNNER_TEMP/browser-playground-results"
      - name: Verify HttpOnly same-origin authentication and cross-origin cookie omission
        run: >-
          node scripts/test/browser-playground.mjs --authenticated-gate
          --site "$RUNNER_TEMP/browser-playground-site"
          --out "$RUNNER_TEMP/browser-authenticated-results"
      - name: Verify the same candidate in Firefox and Linux Playwright WebKit
        run: |
          xvfb-run -a env BROWSER=firefox BROWSER_HEADLESS=0 LIBGL_ALWAYS_SOFTWARE=1 node scripts/test/browser-playground.mjs --site "$RUNNER_TEMP/browser-playground-site" --out "$RUNNER_TEMP/browser-firefox-results"
          xvfb-run -a env BROWSER=webkit BROWSER_HEADLESS=0 LIBGL_ALWAYS_SOFTWARE=1 node scripts/test/browser-playground.mjs --site "$RUNNER_TEMP/browser-playground-site" --out "$RUNNER_TEMP/browser-webkit-results"
      - name: Verify real engine lifecycle pressure and failure cancellation
        run: >-
          node scripts/test/browser-stress.mjs
          --site "$RUNNER_TEMP/browser-playground-site"
          --out "$RUNNER_TEMP/browser-stress-results"
          --fixture game2d --mode production
          --iterations 100 --failures 20
      - name: Join exact-release integration, source-map and lifecycle evidence
        run: >-
          node scripts/release/collect-browser-evidence.mjs
          --site "$RUNNER_TEMP/browser-playground-site"
          --engine-report "$RUNNER_TEMP/browser-engine-report.json"
          --integration "$RUNNER_TEMP/browser-playground-results/report.json"
          --authenticated-report "$RUNNER_TEMP/browser-authenticated-results/report.json"
          --stress "$RUNNER_TEMP/browser-stress-results/report.json"
          --source-maps "$RUNNER_TEMP/browser-source-map-results/report.json"
          --firefox-report "$RUNNER_TEMP/browser-firefox-results/report.json"
          --webkit-report "$RUNNER_TEMP/browser-webkit-results/report.json"
          --out "$RUNNER_TEMP/browser-acceptance.json"
      - name: Seal the validated candidate and verify its external npm consumer
        env:
          RELEASE_VERSION: ${{ inputs.release_version || '0.1.0' }}
        run: |
          node scripts/release/build-web-release.mjs --engine-report "$RUNNER_TEMP/browser-engine-report.json" --assets "$RUNNER_TEMP/browser-playground-site/release-assets.json" --out scripts/jsb.web-engine/dist --version "$RELEASE_VERSION" --validation-report "$RUNNER_TEMP/browser-acceptance.json"
          node scripts/release/pin-web-release.mjs --site "$RUNNER_TEMP/browser-playground-site" --release scripts/jsb.web-engine/dist
          node scripts/release/verify-web-release.mjs --dir scripts/jsb.web-engine/dist --require-certified --pack-out "$RUNNER_TEMP/browser-release-pack" --report "$RUNNER_TEMP/browser-release-verification.json"
      - name: Keep the exact candidate, reports and source-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-conformance-candidate-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/browser-engine-report.json
            ${{ runner.temp }}/browser-engine-report.json.log
            ${{ runner.temp }}/browser-preflight-results
            ${{ runner.temp }}/browser-source-map-results
            ${{ runner.temp }}/browser-playground-results
            ${{ runner.temp }}/browser-authenticated-results
            ${{ runner.temp }}/browser-stress-results
            ${{ runner.temp }}/browser-firefox-results
            ${{ runner.temp }}/browser-webkit-results
            ${{ runner.temp }}/browser-acceptance.json
            ${{ runner.temp }}/browser-release-pack
            ${{ runner.temp }}/browser-release-verification.json
            ${{ runner.temp }}/browser-playground-site
            scripts/jsb.web-engine/dist
