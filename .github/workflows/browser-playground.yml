name: Browser Playground

on:
  pull_request:
    paths:
      - 'scripts/jsb.react*/**'
      - 'scripts/jsb.web-engine/**'
      - 'scripts/release/**'
      - 'scripts/test/**'
      - 'apps/playground/**'
      - 'tests/browser-preflight/**'
      - 'tests/react/**'
      - 'impl/web/**'
      - 'bridge/**'
      - 'compat/**'
      - 'internal/**'
      - 'weaver/**'
      - 'weaver-editor/**'
      - 'register_types.*'
      - 'jsb.*'
      - 'SCsub'
      - 'config.py'
      - '*package*'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/browser-playground.yml'
      - '.github/workflows/build_web.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine_target:
        description: 'Both native targets by default; optionally select one target for a diagnostic run'
        type: choice
        options: [all, template_debug, template_release]
        default: all
      engine_lto:
        description: 'Independent LTO experiment; compare against none'
        type: choice
        options: [none, thin]
        default: none
      module_mode:
        description: 'Baseline versus explicit module selection'
        type: choice
        options: [baseline, explicit]
        default: baseline
      measure_performance:
        description: 'Sample real product startup, FPS and memory after acceptance'
        type: boolean
        default: false
      performance_baseline_run_id:
        description: 'Optional prior run containing frozen legacy baseline sites; absent means measurements have no regression acceptance'
        type: string
        default: ''
      release_version:
        description: 'Exact npm version to prepare (publication is a separate command)'
        type: string
        default: '0.1.0'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  actions: read

concurrency:
  group: browser-playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:react
      - name: Check showcase models and sources
        run: pnpm test:playground
      - name: Verify showcase persistence, imports and compiler regressions
        env:
          PLAYGROUND_TEST_SHELL: '1'
        run: |
          pnpm --filter @godot-js/playground exec playwright install --with-deps chromium
          pnpm --filter @godot-js/playground build:frontend -- --shell-only
          pnpm --filter @godot-js/playground test:browser:projects
          node apps/playground/scripts/browser-project-isolation-test.mjs
          node apps/playground/scripts/browser-release-context-test.mjs
      - name: Release provenance, integrity, npm-pack consumer and failure gates
        run: |
          pnpm test:browser:unit
          node --test scripts/release/test/worker-workflow.test.mjs

  browser:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [full-engine-v1, engine-2d-v1]
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.engine_target != 'all' && inputs.engine_target != '' && format('["{0}"]', inputs.engine_target) || '["template_debug","template_release"]') }}
    name: Native product (${{ matrix.profile }}, ${{ matrix.target }}, lto=${{ inputs.engine_lto || 'none' }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout the identified upstream engine source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 14d19694e0c88a3f9e82d899a0400f27a24c176e
          path: .browser-engine/source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.11'
      - run: python3 -m pip install scons==4.9.1
      - name: Build and collect provenance for an actual single-thread engine
        env:
          ENGINE_TARGET: ${{ matrix.target }}
          EMCC_CORES: '4'
          BINARYEN_CORES: '4'
        run: >-
          node scripts/test/build-browser-engine.mjs
          --godot-source .browser-engine/source
          --build-dir "$RUNNER_TEMP/godot-browser-build"
          --out "$RUNNER_TEMP/browser-engine-report.json"
          --target "$ENGINE_TARGET"
          --profile "${{ matrix.profile }}"
          --lto "${{ inputs.engine_lto || 'none' }}"
          --module-mode "${{ inputs.module_mode || 'baseline' }}"
          --jobs 4
      - name: Package a portable source-bound engine archive
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          import {packageBrowserEngineArtifact,inspectBrowserEngineArtifact} from './scripts/test/package-browser-engine-artifact.mjs';
          const report=process.env.RUNNER_TEMP+'/browser-engine-report.json';
          if(existsSync(report)&&JSON.parse(readFileSync(report,'utf8')).status==='built'){
            const out=process.env.RUNNER_TEMP+'/browser-engine-artifact';
            await packageBrowserEngineArtifact({report,out});
            await inspectBrowserEngineArtifact(out);
          }else console.log('No completed engine archive; portable artifact skipped.');
          NODE
      - name: Measure the exact completed engine archive
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const report=process.env.RUNNER_TEMP+'/browser-engine-report.json';
          if(existsSync(report)&&JSON.parse(readFileSync(report,'utf8')).status==='built'){
            const result=spawnSync(process.execPath,['scripts/test/measure-browser-engine.mjs','--report',report,'--out',process.env.RUNNER_TEMP+'/browser-engine-measurement.json'],{stdio:'inherit'});
            if(result.error)throw result.error;
            process.exitCode=result.status??1;
          }else console.log('No completed engine archive; size measurement skipped.');
          NODE
      - name: Identify the exact source and configuration recipe
        run: node -e 'const fs=require("fs");const report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/browser-engine-report.json"));fs.appendFileSync(process.env.GITHUB_ENV,"ENGINE_RECIPE_HASH="+report.recipeSha256+"\n")'
      - name: Install the pinned browser verification tools
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund playwright@1.57.0
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl-mesa0 pulseaudio pulseaudio-utils
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/browser-tools/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          node --input-type=module -e 'const {chromium}=await import(process.env.RUNNER_TEMP+"/browser-tools/node_modules/playwright-core/index.mjs"); console.log("CHROMIUM="+chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Verify passive observation preserves user activation
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ env.CHROMIUM }}
          PLAYGROUND_BROWSER_DEFAULT_SETTINGS: '1'
        run: node apps/playground/scripts/browser-passive-recorder-test.mjs --out "$RUNNER_TEMP/passive-recorder-proof.json"
      - name: Prepare a real PulseAudio browser mixing device
        run: |
          if ! pulseaudio --check; then
            pulseaudio --start --exit-idle-time=-1
          fi
          godotjs_audio_modules="$(pactl --format=json list modules | node --input-type=module -e 'import {readFileSync} from "node:fs"; const modules=JSON.parse(readFileSync(0,"utf8")); console.log(modules.filter(item=>item.name==="module-null-sink"&&/(?:^|\s)sink_name=godotjs_browser(?:\s|$)/.test(item.argument??"")).length);')"
          if [ "$godotjs_audio_modules" = '0' ]; then
            pactl load-module module-null-sink sink_name=godotjs_browser rate=48000 channels=2
          elif [ "$godotjs_audio_modules" != '1' ]; then
            echo 'Expected a unique godotjs_browser PulseAudio null sink module' >&2
            exit 1
          fi
          pactl set-default-sink godotjs_browser
          pactl info
          pactl --format=json list sinks | node --input-type=module -e 'import {readFileSync} from "node:fs"; const sink=JSON.parse(readFileSync(0,"utf8")).find(item=>item.name==="godotjs_browser"); if(!sink||!/\b2ch\b.*\b48000Hz\b/.test(sink.sample_specification??""))throw Error("Expected the real 48 kHz stereo browser mixing sink"); console.log(JSON.stringify({name:sink.name,state:sink.state,sampleSpecification:sink.sample_specification}));'
      - name: Verify the independent native and production React engine gate
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ env.CHROMIUM }}
        run: >-
          node apps/playground/scripts/browser-engine-profile-gate.mjs
          --engine-js "$RUNNER_TEMP/godot-browser-build/bin/.web_zip/godot.js"
          --engine-wasm "$RUNNER_TEMP/godot-browser-build/bin/.web_zip/godot.wasm"
          --profile "${{ matrix.profile }}"
          --out "$RUNNER_TEMP/profile-gate/${{ matrix.profile }}/${{ matrix.target }}"
      - name: Verify real main-thread compiler, revision and preview races
        run: node --test apps/playground/test/*.test.mjs
      - name: Prepare the existing native browser regression gate
        if: matrix.profile == 'full-engine-v1'
        env:
          GODOT_SOURCE: ${{ runner.temp }}/godot-browser-build
          ENGINE_TARGET: ${{ matrix.target }}
        run: |
          export GODOT_WEB_TEMPLATE="$RUNNER_TEMP/godot-browser-build/bin/godot.web.$ENGINE_TARGET.wasm32.nothreads.zip"
          node tests/browser-preflight/prepare.mjs "$RUNNER_TEMP/browser-preflight-site"
      - name: Verify native boot, real canvas input, restart, exit and tamper rejection
        if: matrix.profile == 'full-engine-v1'
        run: node tests/browser-preflight/verify.mjs "$RUNNER_TEMP/browser-preflight-site" "$RUNNER_TEMP/browser-preflight-results"
      - name: Verify native authored source locations, compressed columns and uncaught errors
        if: matrix.profile == 'full-engine-v1'
        env:
          ENGINE_BUILD_REPORT: ${{ runner.temp }}/browser-engine-report.json
        run: node tests/browser-preflight/verify-source-maps.mjs "$RUNNER_TEMP/browser-preflight-site" "$RUNNER_TEMP/browser-source-map-results"
      - name: Build the headless GodotJS editor for native project and demo resource export
        working-directory: ${{ runner.temp }}/godot-browser-build
        run: >-
          scons -j4 platform=linuxbsd target=editor arch=x86_64
          skip_js_runtime=yes use_quickjs_ng=yes tests=no optimize=speed debug_symbols=no
          vulkan=no opengl3=no x11=no wayland=no alsa=no pulseaudio=no
          dbus=no speechd=no udev=no sdl=no fontconfig=no accesskit=no
          modules_enabled_by_default=no module_GodotJS_enabled=yes
          module_regex_enabled=yes module_gdscript_enabled=yes module_freetype_enabled=yes
          module_svg_enabled=yes module_text_server_fb_enabled=yes module_gridmap_enabled=yes
          module_navigation_2d_enabled=yes module_navigation_3d_enabled=yes
          module_godot_physics_2d_enabled=yes module_godot_physics_3d_enabled=yes
          module_ogg_enabled=yes module_vorbis_enabled=yes module_gltf_enabled=yes module_jpg_enabled=yes
      - name: Build the selected native product candidate
        env:
          GODOT: ${{ runner.temp }}/godot-browser-build/bin/godot.linuxbsd.editor.x86_64
          GODOT_IMPORTER: ${{ runner.temp }}/godot-browser-build/bin/godot.linuxbsd.editor.x86_64
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ env.CHROMIUM }}
        run: >-
          node apps/playground/scripts/build.mjs
          --engine-report "$RUNNER_TEMP/browser-engine-report.json"
          --profile "${{ matrix.profile }}"
          --target "${{ matrix.target }}"
          --skip-sdk-build
          --work-dir "$RUNNER_TEMP/product-work/${{ matrix.profile }}/${{ matrix.target }}"
          --out "$RUNNER_TEMP/default-playground-site"
      - name: Prepare transparent HTTP delivery variants
        run: node apps/playground/scripts/prepare-site-delivery.mjs "$RUNNER_TEMP/default-playground-site"
      - name: Accept both explicit Worker presenters against the exact candidate
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ env.CHROMIUM }}
          PLAYGROUND_BROWSER_DEFAULT_SETTINGS: '1'
          BROWSER_HEADLESS: '0'
          PLAYGROUND_VIRTUAL_DISPLAY: '1'
          PLAYGROUND_AUDIO_DEVICE_KIND: 'pulse-null-sink'
        run: >-
          xvfb-run -a node apps/playground/scripts/worker-acceptance-matrix.mjs
          --site "$RUNNER_TEMP/default-playground-site"
          --out "$RUNNER_TEMP/default-playground-results"
      - name: Download independent frozen performance baseline sites
        if: github.event_name == 'workflow_dispatch' && inputs.measure_performance && inputs.performance_baseline_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.performance_baseline_run_id }}
          pattern: browser-playground-candidate-${{ matrix.profile }}-${{ matrix.target }}-*
          path: ${{ runner.temp }}/performance-baseline-artifacts
      - name: Measure fixed legacy-to-Worker performance regression budgets
        if: github.event_name == 'workflow_dispatch' && inputs.measure_performance
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ env.CHROMIUM }}
          PLAYGROUND_BROWSER_DEFAULT_SETTINGS: '1'
          BROWSER_HEADLESS: '0'
          PLAYGROUND_VIRTUAL_DISPLAY: '1'
          PLAYGROUND_AUDIO_DEVICE_KIND: 'pulse-null-sink'
          PERFORMANCE_BASELINE_RUN_ID: ${{ inputs.performance_baseline_run_id }}
        run: |
          if [ -n "$PERFORMANCE_BASELINE_RUN_ID" ]; then
            node --input-type=module <<'BASELINE_SITE'
          import {readdir,access,writeFile} from 'node:fs/promises';
          import path from 'node:path';
          const sites=[];
          async function visit(directory){for(const item of await readdir(directory,{withFileTypes:true})){const file=path.join(directory,item.name);if(item.isDirectory())await visit(file);else if(item.name==='engine-release.json'){try{await access(path.join(directory,'preview.legacy.html'));sites.push(directory);}catch{}}}}
          await visit(path.join(process.env.RUNNER_TEMP,'performance-baseline-artifacts'));
          if(sites.length!==1)throw Error('Expected exactly one frozen legacy baseline site, received '+sites.length);
          await writeFile(path.join(process.env.RUNNER_TEMP,'performance-baseline-site.txt'),sites[0]);
          BASELINE_SITE
          fi
          xvfb-run -a sh -eu <<'WORKER_PERFORMANCE'
          if [ -n "$PERFORMANCE_BASELINE_RUN_ID" ]; then
            baseline_site=$(cat "$RUNNER_TEMP/performance-baseline-site.txt")
            node apps/playground/scripts/browser-engine-performance.mjs --site "$baseline_site" --out "$RUNNER_TEMP/browser-engine-performance.legacy.json" --samples 3 --browser chromium --execution legacy
          fi
          worker_performance_status=0
          if [ -n "$PERFORMANCE_BASELINE_RUN_ID" ]; then
            node apps/playground/scripts/browser-engine-performance.mjs --site "$RUNNER_TEMP/default-playground-site" --out "$RUNNER_TEMP/browser-engine-performance.worker-direct.json" --samples 3 --browser chromium --execution worker --presentation-backend direct --baseline "$RUNNER_TEMP/browser-engine-performance.legacy.json" --write-budget "$RUNNER_TEMP/browser-engine-budget.direct.json" || worker_performance_status=1
            node apps/playground/scripts/browser-engine-performance.mjs --site "$RUNNER_TEMP/default-playground-site" --out "$RUNNER_TEMP/browser-engine-performance.worker-bitmap.json" --samples 3 --browser chromium --execution worker --presentation-backend bitmap --baseline "$RUNNER_TEMP/browser-engine-performance.legacy.json" --write-budget "$RUNNER_TEMP/browser-engine-budget.bitmap.json" || worker_performance_status=1
          else
            echo 'No external legacy baseline supplied; regression acceptance remains not-evaluated.'
            node apps/playground/scripts/browser-engine-performance.mjs --site "$RUNNER_TEMP/default-playground-site" --out "$RUNNER_TEMP/browser-engine-performance.worker-direct.json" --samples 3 --browser chromium --execution worker --presentation-backend direct || worker_performance_status=1
            node apps/playground/scripts/browser-engine-performance.mjs --site "$RUNNER_TEMP/default-playground-site" --out "$RUNNER_TEMP/browser-engine-performance.worker-bitmap.json" --samples 3 --browser chromium --execution worker --presentation-backend bitmap || worker_performance_status=1
          fi
          exit "$worker_performance_status"
          WORKER_PERFORMANCE
      - name: Keep the default product candidate and its exact-site acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-playground-candidate-${{ matrix.profile }}-${{ matrix.target }}-${{ inputs.engine_lto || 'none' }}-${{ env.ENGINE_RECIPE_HASH }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/default-playground-site
            ${{ runner.temp }}/default-playground-results
            ${{ runner.temp }}/passive-recorder-proof.json
            ${{ runner.temp }}/profile-gate
            ${{ runner.temp }}/basic-text-results
            ${{ runner.temp }}/browser-engine-report.json
            ${{ runner.temp }}/browser-engine-measurement.json
            ${{ runner.temp }}/browser-engine-performance.legacy.json
            ${{ runner.temp }}/browser-engine-performance.worker-direct.json
            ${{ runner.temp }}/browser-engine-performance.worker-bitmap.json
            ${{ runner.temp }}/browser-engine-budget.direct.json
            ${{ runner.temp }}/browser-engine-budget.bitmap.json
            ${{ runner.temp }}/browser-engine-artifact
      - name: Prepare the compatibility conformance candidate
        if: matrix.profile == 'full-engine-v1'
        env:
          RELEASE_VERSION: ${{ inputs.release_version || '0.1.0' }}
        run: >-
          node scripts/test/prepare-browser-playground.mjs
          --engine-report "$RUNNER_TEMP/browser-engine-report.json"
          --out "$RUNNER_TEMP/browser-playground-site"
          --version "$RELEASE_VERSION"
      - name: Verify the actual Playground and collect release-bound evidence
        if: matrix.profile == 'full-engine-v1'
        run: >-
          node scripts/test/browser-playground.mjs
          --site "$RUNNER_TEMP/browser-playground-site"
          --out "$RUNNER_TEMP/browser-playground-results"
      - name: Verify HttpOnly same-origin authentication and cross-origin cookie omission
        if: matrix.profile == 'full-engine-v1'
        run: >-
          node scripts/test/browser-playground.mjs --authenticated-gate
          --site "$RUNNER_TEMP/browser-playground-site"
          --out "$RUNNER_TEMP/browser-authenticated-results"
      - name: Verify the same candidate in Firefox and Linux Playwright WebKit
        if: matrix.profile == 'full-engine-v1'
        run: |
          xvfb-run -a env BROWSER=firefox BROWSER_HEADLESS=0 LIBGL_ALWAYS_SOFTWARE=1 node scripts/test/browser-playground.mjs --site "$RUNNER_TEMP/browser-playground-site" --out "$RUNNER_TEMP/browser-firefox-results"
          xvfb-run -a env BROWSER=webkit BROWSER_HEADLESS=0 LIBGL_ALWAYS_SOFTWARE=1 node scripts/test/browser-playground.mjs --site "$RUNNER_TEMP/browser-playground-site" --out "$RUNNER_TEMP/browser-webkit-results"
      - name: Verify real engine lifecycle pressure and failure cancellation
        if: matrix.profile == 'full-engine-v1'
        run: >-
          node scripts/test/browser-stress.mjs
          --site "$RUNNER_TEMP/browser-playground-site"
          --out "$RUNNER_TEMP/browser-stress-results"
          --fixture game2d --mode production
          --iterations 100 --failures 20
      - name: Join exact-release integration, source-map and lifecycle evidence
        if: matrix.profile == 'full-engine-v1'
        run: >-
          node scripts/release/collect-browser-evidence.mjs
          --site "$RUNNER_TEMP/browser-playground-site"
          --engine-report "$RUNNER_TEMP/browser-engine-report.json"
          --integration "$RUNNER_TEMP/browser-playground-results/report.json"
          --authenticated-report "$RUNNER_TEMP/browser-authenticated-results/report.json"
          --stress "$RUNNER_TEMP/browser-stress-results/report.json"
          --source-maps "$RUNNER_TEMP/browser-source-map-results/report.json"
          --firefox-report "$RUNNER_TEMP/browser-firefox-results/report.json"
          --webkit-report "$RUNNER_TEMP/browser-webkit-results/report.json"
          --out "$RUNNER_TEMP/browser-acceptance.json"
      - name: Seal the validated candidate and verify its external npm consumer
        if: matrix.profile == 'full-engine-v1'
        env:
          RELEASE_VERSION: ${{ inputs.release_version || '0.1.0' }}
        run: |
          node scripts/release/build-web-release.mjs --engine-report "$RUNNER_TEMP/browser-engine-report.json" --assets "$RUNNER_TEMP/browser-playground-site/release-assets.json" --out scripts/jsb.web-engine/dist --version "$RELEASE_VERSION" --validation-report "$RUNNER_TEMP/browser-acceptance.json"
          node scripts/release/pin-web-release.mjs --site "$RUNNER_TEMP/browser-playground-site" --release scripts/jsb.web-engine/dist
          node scripts/release/verify-web-release.mjs --dir scripts/jsb.web-engine/dist --require-certified --pack-out "$RUNNER_TEMP/browser-release-pack" --report "$RUNNER_TEMP/browser-release-verification.json"
      - name: Keep the exact candidate, reports and source-build evidence
        if: always() && matrix.profile == 'full-engine-v1'
        uses: actions/upload-artifact@v4
        with:
          name: browser-conformance-candidate-${{ github.sha }}-${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/browser-engine-report.json
            ${{ runner.temp }}/browser-engine-report.json.log
            ${{ runner.temp }}/browser-preflight-results
            ${{ runner.temp }}/browser-source-map-results
            ${{ runner.temp }}/browser-playground-results
            ${{ runner.temp }}/browser-authenticated-results
            ${{ runner.temp }}/browser-stress-results
            ${{ runner.temp }}/browser-firefox-results
            ${{ runner.temp }}/browser-webkit-results
            ${{ runner.temp }}/browser-acceptance.json
            ${{ runner.temp }}/browser-release-pack
            ${{ runner.temp }}/browser-release-verification.json
            ${{ runner.temp }}/browser-engine-artifact
            ${{ runner.temp }}/browser-playground-site
            scripts/jsb.web-engine/dist


  rollout-summary:
    name: Aggregate all four Worker product targets without publishing
    needs: browser
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect the immutable candidates and their evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: browser-playground-candidate-*
          path: ${{ runner.temp }}/worker-candidates
      - name: Assess default-switch and publication gates
        env:
          WORKER_ARTIFACT_ROOT: ${{ runner.temp }}/worker-candidates
          WORKER_ROLLOUT_OUT: ${{ runner.temp }}/worker-rollout-summary.json
          WORKER_BROWSER_JOB_RESULT: ${{ needs.browser.result }}
        run: |
          node --input-type=module <<'WORKER_AGGREGATE'
          import {readFile,readdir,mkdir,writeFile,appendFile} from 'node:fs/promises';
          import path from 'node:path';
          import {assessWorkerRollout,assertWorkerPerformanceEvidence} from './apps/playground/scripts/worker-rollout-gates.mjs';
          const root=path.resolve(process.env.WORKER_ARTIFACT_ROOT),out=path.resolve(process.env.WORKER_ROLLOUT_OUT);
          const load=async filename=>JSON.parse(await readFile(filename,'utf8'));
          const failures=[],inventory=[],candidates=[],seen=new Set();
          let artifacts=[];
          try{artifacts=await readdir(root,{withFileTypes:true});}catch(error){if(error.code!=='ENOENT')throw error;}
          for(const artifact of artifacts.filter(entry=>entry.isDirectory()).sort((a,b)=>a.name.localeCompare(b.name))){
            const directory=path.join(root,artifact.name),site=path.join(directory,'default-playground-site'),reports=path.join(directory,'default-playground-results');
            const item={artifact:artifact.name,status:'blocked'};inventory.push(item);
            try{
              const manifest=await load(path.join(site,'manifest.json'));
              item.key=manifest.runtimeProfile+':'+manifest.engineTarget;
              if(seen.has(item.key))throw Error('Duplicate target artifact '+item.key);
              seen.add(item.key);
              const performance={baseline:path.join(directory,'browser-engine-performance.legacy.json'),...Object.fromEntries(['direct','bitmap'].map(presentation=>[presentation,{report:path.join(directory,'browser-engine-performance.worker-'+presentation+'.json'),budget:path.join(directory,'browser-engine-budget.'+presentation+'.json')}]))};
              candidates.push({site,reports,capabilities:path.join(reports,'worker-capabilities.json'),performance});
              const receipt=await load(path.join(reports,'site-acceptance.json'));
              item.acceptanceBatchId=receipt.acceptanceBatchId;item.candidateId=receipt.candidateId;item.siteHash=receipt.siteHash;
              item.performance=await assertWorkerPerformanceEvidence(receipt,performance,{target:manifest.engineTarget,site});
              item.status='evidence-collected';
            }catch(error){item.failure=String(error.message??error);failures.push(artifact.name+': '+item.failure);}
          }
          const requiredTargets=[];
          for(const profile of ['full-engine-v1','engine-2d-v1'])for(const target of ['template_debug','template_release'])requiredTargets.push(profile+':'+target);
          const missingTargets=requiredTargets.filter(key=>!seen.has(key));
          failures.push(...missingTargets.map(key=>'Missing target artifact: '+key));
          if(process.env.WORKER_BROWSER_JOB_RESULT!=='success')failures.push('Upstream native product matrix: '+process.env.WORKER_BROWSER_JOB_RESULT);
          const result=await assessWorkerRollout({candidates});
          result.failures.push(...failures);
          if(result.failures.length){result.defaultSwitch='blocked';result.publication='blocked';}
          result.status=result.failures.length?'blocked':'ready-for-review';
          result.requiredTargets=requiredTargets;result.missingTargets=missingTargets;result.artifacts=inventory;
          result.automaticPublication=false;
          await mkdir(path.dirname(out),{recursive:true});await writeFile(out,JSON.stringify(result,null,2)+'\n');
          if(process.env.GITHUB_STEP_SUMMARY)await appendFile(process.env.GITHUB_STEP_SUMMARY,'## Worker rollout evidence\n\nStatus: **'+result.status+'**. Default switch: **'+result.defaultSwitch+'**. Publication: **'+result.publication+'**.\n\n'+result.failures.map(message=>'- '+message).join('\n')+'\n');
          console.log(JSON.stringify({status:result.status,defaultSwitch:result.defaultSwitch,publication:result.publication,missingTargets,failures:result.failures},null,2));
          WORKER_AGGREGATE
      - name: Preserve the explicit rollout decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-rollout-summary-${{ github.sha }}
          path: ${{ runner.temp }}/worker-rollout-summary.json
          if-no-files-found: error
          retention-days: 14
