name: 🍏 iOS Builds
on:
  workflow_call:
    inputs:
      release:
        required: true
        type: boolean
      version:
        required: true
        type: string
      version_mm:
        required: true
        type: string
      version_ref:
        description: "Godot engine commit reference"
        required: true
        type: string

# Global Settings
env:
  # Ideally we'd use dev_mode=yes. Unfortunately, v8 headers contain warnings. So we manually set some dev_mode options.
  SCONS_FLAGS: >-
    verbose=yes
    warnings=extra
    strict_checks=yes
    module_text_server_fb_enabled=yes
    tests=no
    debug_symbols=no
    skip_js_runtime=yes
    enable_legacy_react=no

jobs:
  ios-template:
    runs-on: macos-latest
    timeout-minutes: 60
    name: iOS (${{ matrix.target }}, ${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        engine: [ v8, qjs-ng, jsc ]
        target: ${{ inputs.release && fromJSON('["template_release","template_debug"]') || fromJSON('["template_debug"]') }}
    steps:
      - name: Checkout Godot
        uses: actions/checkout@v6
        with:
          repository: godotengine/godot
          ref: ${{ inputs.version_ref }}
          submodules: recursive

      - name: Checkout GodotJS
        uses: actions/checkout@v6
        with:
          path: ${{github.workspace}}/modules/GodotJS/
          lfs: true
          submodules: recursive

      - name: Setup Node.js for the pinned native integration
        if: inputs.version == '4.6.1'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Prepare the verified Godot 4.6.1 native source hooks
        if: inputs.version == '4.6.1'
        shell: bash
        run: >-
          node modules/GodotJS/scripts/test/prepare-native-engine.mjs
          --godot-source . --out native-integration.json

      # From https://github.com/actions/runner-images/blob/main/images/macos
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        continue-on-error: true
        with:
          cache-name: ios-${{ matrix.target }}-${{inputs.version}}-${{ matrix.engine }}

      - name: Download scripts/out
        uses: actions/download-artifact@v8
        with:
          name: scripts-out
          path: ${{github.workspace}}/modules/GodotJS/scripts/out

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            ${{ matrix.engine == 'qjs-ng' && 'use_quickjs_ng=yes' || '' }}
            ${{ matrix.engine == 'jsc' && 'use_jsc=yes' || '' }}
          platform: ios
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ios-${{ matrix.target }}-${{inputs.version}}-${{ matrix.engine }}
        continue-on-error: true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ios-${{ matrix.target }}-${{inputs.version}}-${{ matrix.engine }}

      - name: Upload the native source integration receipt
        if: always() && inputs.version == '4.6.1'
        uses: actions/upload-artifact@v7
        with:
          name: native-integration-ios-${{ matrix.target }}-${{ inputs.version }}-${{ matrix.engine }}
          path: native-integration.json
          if-no-files-found: warn
