name: Browser engine Worker
on:
  pull_request:
    paths:
      - 'bridge/**'
      - 'impl/web/**'
      - 'compat/**'
      - 'internal/**'
      - 'weaver/**'
      - 'weaver-editor/**'
      - 'packages/**'
      - 'scripts/**'
      - 'apps/playground/**'
      - 'tests/browser-preflight/**'
      - 'SCsub'
      - 'config.py'
      - 'register_types.*'
      - 'jsb.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.github/workflows/browser-worker.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to validate; WebKit 26 is currently unsupported (WK-01), not a passing full-engine target'
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium
permissions:
  contents: read
concurrency:
  group: browser-worker-${{ github.ref }}-${{ inputs.browser || 'chromium' }}
  cancel-in-progress: true
jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 14d19694e0c88a3f9e82d899a0400f27a24c176e
          path: .browser-worker/source
      - name: Keep the upstream source outside the module snapshot
        run: |
          mv .browser-worker/source "$RUNNER_TEMP/godot-worker-source"
          rmdir .browser-worker
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.11'
      - name: Select a job-local browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install scons==4.10.0
      - name: Record and check the selected toolchain
        run: |
          node --version
          pnpm --version
          python3 --version
          scons --version
          emcc --version
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const pnpm=pkg.packageManager.match(/^pnpm@([^+]+)/)?.[1];
          if(execFileSync('pnpm',['--version'],{encoding:'utf8'}).trim()!==pnpm)throw Error('pnpm differs from packageManager');
          if(process.version!=='v'+readFileSync('.node-version','utf8').trim())throw Error('Node differs from .node-version');
          NODE
          echo "EMSDK_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:react && pnpm test:engine && pnpm test:browser:unit
      - name: Build, patch and browser-selection regressions
        run: node --test apps/playground/scripts/engine-profiles.test.mjs apps/playground/scripts/engine-artifacts.test.mjs apps/playground/scripts/engine-patches.test.mjs apps/playground/scripts/engine-audio-server-finish.test.mjs apps/playground/scripts/browser-prepare-worker-products.test.mjs scripts/test/browser-launch.test.mjs
      - name: Install pinned browsers for API capture, product paths and the unsupported guard
        run: |
          pnpm --filter @godot-js/playground exec playwright install --with-deps chromium firefox webkit
          node --input-type=module - <<'NODE' >> "$GITHUB_ENV"
          import {createRequire} from 'node:module';
          const {chromium,firefox,webkit}=createRequire(process.cwd()+'/apps/playground/package.json')('playwright');
          console.log('PLAYWRIGHT_CHROMIUM_EXECUTABLE='+chromium.executablePath());
          console.log('PLAYWRIGHT_FIREFOX_EXECUTABLE='+firefox.executablePath());
          console.log('PLAYWRIGHT_WEBKIT_EXECUTABLE='+webkit.executablePath());
          NODE
      - name: Install the real Linux display and audio environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils pulseaudio pulseaudio-utils libasound2-plugins libgl1-mesa-dri curl unzip ca-certificates
          dpkg-query -W xvfb x11-utils pulseaudio pulseaudio-utils libasound2-plugins libgl1-mesa-dri
          bash -n scripts/test/run-browser-worker-linux.sh
      - name: Build the complete Worker engine and bind actual compiler flags
        env:
          EMCC_CORES: '4'
          BINARYEN_CORES: '4'
        run: >-
          node scripts/test/build-browser-engine.mjs
          --godot-source "$RUNNER_TEMP/godot-worker-source"
          --build-dir "$RUNNER_TEMP/godot-browser-worker"
          --out "$RUNNER_TEMP/worker-engine-report.json"
          --profile full-engine-v1 --execution-model proxy-pthread --jobs 4
      - name: Verify native checkpoints and cleanup against the exact pthread build
        env:
          BROWSER_EXECUTABLE: ${{ env.PLAYWRIGHT_CHROMIUM_EXECUTABLE }}
        run: |
          node scripts/test/native-web-checkpoint-probe.mjs --report "$RUNNER_TEMP/worker-engine-report.json" --out "$RUNNER_TEMP/worker-native-checkpoint"
          node scripts/test/native-web-checkpoint-probe.mjs --report "$RUNNER_TEMP/worker-engine-report.json" --out "$RUNNER_TEMP/worker-child-lifetime" --child-barrier --cleanup-jobs 18000000
          node scripts/test/browser-web-lifecycle.mjs --engine-report "$RUNNER_TEMP/worker-engine-report.json" --out "$RUNNER_TEMP/worker-lifecycle"
          node scripts/test/web-worker-transfer-probe.mjs --report "$RUNNER_TEMP/worker-engine-report.json" --out "$RUNNER_TEMP/worker-native-transfers"
          node scripts/test/web-threaded-shadow-probe.mjs --report "$RUNNER_TEMP/worker-engine-report.json" --out "$RUNNER_TEMP/worker-threaded-resources"
      - name: Install the exact Godot 4.6.1 resource importer and exporter
        run: |
          mkdir -p "$RUNNER_TEMP/godot-resource-tool"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot-resource-tool/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          echo "cecd0cb6b55e931318a9d7237dc4197d69ea914966787a454808523626e2789f  $RUNNER_TEMP/godot-resource-tool/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot-resource-tool/godot.zip" -d "$RUNNER_TEMP/godot-resource-tool"
          chmod +x "$RUNNER_TEMP/godot-resource-tool/Godot_v4.6.1-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot-resource-tool/Godot_v4.6.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "GODOT_IMPORTER=$RUNNER_TEMP/godot-resource-tool/Godot_v4.6.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Build two genuine sealed Worker product tuples for the rollback fixture
        run: >-
          node apps/playground/scripts/browser-prepare-worker-products.mjs
          --engine-report "$RUNNER_TEMP/worker-engine-report.json"
          --out "$RUNNER_TEMP/worker-products"
          --work-dir "$RUNNER_TEMP/worker-product-build"
      - name: Verify real shared-memory startup capability and unsupported cleanup
        run: |
          PLAYGROUND_PREFLIGHT_DIRECTORY="$RUNNER_TEMP/worker-capability" \
            node apps/playground/scripts/browser-shared-memory-preflight-test.mjs
          PLAYGROUND_TEST_DIRECTORY="$RUNNER_TEMP/worker-products/current" \
          PLAYGROUND_UNSUPPORTED_REPORT="$RUNNER_TEMP/worker-unsupported.json" \
            node apps/playground/scripts/browser-worker-unsupported-test.mjs
      - name: Verify isolated execution, React, physics, child workers and pool restart
        if: inputs.browser != 'webkit'
        run: >-
          bash scripts/test/run-browser-worker-linux.sh
          "${{ inputs.browser || 'chromium' }}" "$RUNNER_TEMP/worker-runtime" --
          node scripts/test/browser-pthread-integration.mjs
          --engine-report "$RUNNER_TEMP/worker-engine-report.json"
          --out "$RUNNER_TEMP/worker-runtime"
          --browser "${{ inputs.browser || 'chromium' }}"
          --loops 100
      - name: Verify the formal product compiler, loader, authored stacks, Runner and whole-tuple rollback
        env:
          PLAYGROUND_ACCEPTANCE_CONTEXT: ${{ runner.temp }}/worker-products/current-context.json
        run: >-
          bash scripts/test/run-browser-worker-linux.sh
          "${{ inputs.browser || 'chromium' }}" "$RUNNER_TEMP/worker-product-runtime" --
          node apps/playground/scripts/browser-worker-product-suite.mjs
          --directory "$RUNNER_TEMP/worker-products/current"
          --previous "$RUNNER_TEMP/worker-products/previous"
          --out "$RUNNER_TEMP/worker-product-runtime"
          --browser "${{ inputs.browser || 'chromium' }}"
          --loops "${{ inputs.browser == 'firefox' && '2' || '100' }}"
      - name: Record the actual browser outcome and platform scope
        if: always()
        env:
          WORKER_BROWSER: ${{ inputs.browser || 'chromium' }}
        run: |
          node --input-type=module - <<'NODE'
          import {readFile,appendFile} from 'node:fs/promises';
          let report,product,guard;
          try{report=JSON.parse(await readFile(process.env.RUNNER_TEMP+'/worker-runtime/worker-integration.json','utf8'));}catch{}
          try{product=JSON.parse(await readFile(process.env.RUNNER_TEMP+'/worker-product-runtime/product-suite.json','utf8'));}catch{}
          try{guard=JSON.parse(await readFile(process.env.RUNNER_TEMP+'/worker-unsupported.json','utf8'));}catch{}
          let summary='### Worker browser validation\n\nBrowser: '+process.env.WORKER_BROWSER+'\n\nActual runtime report: '+(report?.status??'missing; the job did not complete runtime validation')+'\n';
          summary+='\nFormal exact-candidate product suite: '+(product?.status??'missing')+'\n';
          if(product?.candidateId)summary+='\nProduct candidate: '+product.candidateId+'\n';
          summary+='\nWebKit unsupported startup guard: '+(guard?.status??'missing')+'; workerExecutionSupported='+String(guard?.workerExecutionSupported??'unverified')+'\n';
          summary+='\nRollback uses two fully built SDK-version fixture tuples; the previous prerelease fixture is not a historical deployed release. Supported-browser passes do not clear the WK-01 all-browser HOLD.\n';
          if(report?.phase)summary+='\nPhase: '+report.phase+'\n';
          if(process.env.WORKER_BROWSER==='webkit')summary+='\nPlaywright 1.57 / Linux WebKit 26 is unsupported for this complete pthread engine (WK-01: stale memory.size and bulk-memory bounds after shared-memory growth). The startup capability guard must reject it before engine fetch. This run does not certify WebKit/Safari support, and an unsupported outcome remains a failed full-engine job.\n';
          summary+='\nSee uploaded native and product reports, authored stack/PCK map hashes, runtime logs and environment evidence. A virtual PulseAudio sink proves real processing, not a physical speaker.\n';
          console.log(summary);await appendFile(process.env.GITHUB_STEP_SUMMARY,summary);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-worker-evidence-${{ inputs.browser || 'chromium' }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/worker-engine-report.json*
            ${{ runner.temp }}/worker-native-checkpoint/
            ${{ runner.temp }}/worker-child-lifetime/
            ${{ runner.temp }}/worker-lifecycle/
            ${{ runner.temp }}/worker-native-transfers/
            ${{ runner.temp }}/worker-threaded-resources/
            ${{ runner.temp }}/worker-runtime/worker-integration.json
            ${{ runner.temp }}/worker-runtime/runtime.log
            ${{ runner.temp }}/worker-runtime/environment/
            ${{ runner.temp }}/worker-products/fixture-build.json
            ${{ runner.temp }}/worker-products/current-context.json
            ${{ runner.temp }}/worker-product-runtime/
            ${{ runner.temp }}/worker-unsupported.json
            ${{ runner.temp }}/worker-capability/
      - name: Share the exact validated candidates with the Firefox product job
        if: success() && (inputs.browser == '' || inputs.browser == 'chromium')
        uses: actions/upload-artifact@v4
        with:
          name: browser-worker-product-candidates
          path: ${{ runner.temp }}/worker-products/
          if-no-files-found: error

  product-firefox:
    needs: worker
    if: inputs.browser == '' || inputs.browser == 'chromium'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select a job-local browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @godot-js/playground exec playwright install --with-deps firefox
      - name: Install the real Firefox display and audio environment
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb x11-utils pulseaudio pulseaudio-utils libasound2-plugins libgl1-mesa-dri
      - uses: actions/download-artifact@v4
        with:
          name: browser-worker-product-candidates
          path: ${{ runner.temp }}/worker-products
      - name: Verify the same sealed product bytes in Firefox
        env:
          PLAYGROUND_ACCEPTANCE_CONTEXT: ${{ runner.temp }}/worker-products/current-context.json
        run: >-
          bash scripts/test/run-browser-worker-linux.sh firefox "$RUNNER_TEMP/worker-product-firefox" --
          node apps/playground/scripts/browser-worker-product-suite.mjs
          --directory "$RUNNER_TEMP/worker-products/current"
          --previous "$RUNNER_TEMP/worker-products/previous"
          --out "$RUNNER_TEMP/worker-product-firefox" --browser firefox --loops 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-worker-product-firefox-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/worker-product-firefox/
